name: Deploy Preview

on:
  push:
    tags:
      - 'preview-*'

permissions:
  contents: read
  id-token: write # required for AWS OIDC (no stored credentials)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generate a short-lived token via GitHub App to access the private
      # release-notes repo. Same secrets as the production deploy workflow.
      - name: Generate release-notes access token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_NOTES_APP_ID }}
          private-key: ${{ secrets.RELEASE_NOTES_APP_KEY }}
          owner: invisyne
          repositories: release-notes

      - name: Checkout release-notes
        uses: actions/checkout@v4
        with:
          repository: invisyne/release-notes
          token: ${{ steps.app-token.outputs.token }}
          path: release-notes

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@invisyne'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PREVIEW_BUILD flips the noindex meta tag on (see src/components/Head.astro).
      # SITE_URL overrides astro.config.mjs's `site` so sitemap/canonical URLs point at
      # preview.docs.invisyne.com instead of the production domain.
      # PDF generation is skipped here — not needed for a partner content review.
      - run: npm run build
        env:
          RELEASE_NOTES_PATH: release-notes
          PREVIEW_BUILD: 'true'
          SITE_URL: https://preview.docs.invisyne.com

      # Overwrites whatever robots.txt astro produced — the preview site should never
      # be crawled, independent of the noindex meta tag on individual pages.
      - name: Block all crawlers
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      # CNAME is a GitHub Pages concept only — not needed for S3, the custom domain
      # routing happens entirely via CloudFront (see CR-1057, hub-infrastructure).
      - name: Remove GitHub Pages CNAME artifact
        run: rm -f dist/CNAME

      # OIDC federation — no stored AWS credentials. Role and its trust policy
      # (scoped to this repo) are created in CR-1057 (hub-infrastructure).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PREVIEW_AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ vars.PREVIEW_S3_BUCKET }}" --delete

      # Not required for functionality (S3 content is already updated), but avoids
      # serving stale cached pages until CloudFront's default TTL expires.
      - name: Invalidate CloudFront cache
        if: vars.PREVIEW_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.PREVIEW_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'
