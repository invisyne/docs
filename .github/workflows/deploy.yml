name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generate a short-lived token via GitHub App to access the private
      # release-notes repo. Requires two secrets in this repo's settings:
      #   RELEASE_NOTES_APP_ID      — the App's numeric ID
      #   RELEASE_NOTES_APP_KEY     — the App's private key (PEM)
      - name: Generate release-notes access token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_NOTES_APP_ID }}
          private-key: ${{ secrets.RELEASE_NOTES_APP_KEY }}
          owner: invisyne
          repositories: release-notes

      - name: Checkout release-notes
        uses: actions/checkout@v4
        with:
          repository: invisyne/release-notes  # TODO: update with actual org/repo name
          token: ${{ steps.app-token.outputs.token }}
          path: release-notes

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelogs
        run: node scripts/generate-changelogs.js release-notes

      - run: npm run build

      - name: Generate PDFs
        run: node scripts/generate-pdfs.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
