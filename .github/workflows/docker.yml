name: Build & Push Docker Image to ECR

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate release-notes access token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_NOTES_APP_ID }}
          private-key: ${{ secrets.RELEASE_NOTES_APP_KEY }}
          owner: invisyne
          repositories: release-notes

      - name: Checkout release-notes
        uses: actions/checkout@v4
        with:
          repository: invisyne/release-notes
          token: ${{ steps.app-token.outputs.token }}
          path: release-notes

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/invisyne-docs:${{ github.ref_name }}
            ${{ steps.ecr-login.outputs.registry }}/invisyne-docs:latest
          build-args: |
            RELEASE_NOTES_PATH=release-notes
