server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Let Starlight's client-side router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PDFs are in dist/downloads/ — serve them directly
    location /downloads/ {
        try_files $uri =404;
    }
}
